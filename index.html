<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Site - Spinosaurus</title>  

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                background-color: #1f0430;
                color: #00ffea;
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
            }

            header {
                background-color: #3b0857;
                color: #00ffea;
                text-align: center;
                max-width: 800px;
                margin: 0 auto 20px auto;
                border: 5px solid rgb(15, 158, 34);
                padding: 16px;
                border-radius: 8px;
            }

            main {
                background-color: #3b0857;
                color: #00ffea;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid rgb(15, 158, 34);
                padding: 16px;
                border-radius: 8px;
            }

            article { 
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 20px;
                margin-bottom: 25px;
                padding-bottom: 20px;
                border-bottom: 2px dashed rgb(15, 158, 34);
            }

            article:last-child {
                border-bottom: none;
                margin-bottom: 0;
                padding-bottom: 0;
            }

            /* Ajuste e padronização do tamanho das imagens */
            article img {
                width: 100%;
                max-width: 350px;
                height: 220px;
                object-fit: cover; /* Garante que a imagem preencha a área sem distorcer */
                border-radius: 8px;
                border: 2px solid #00ffea;
            }

            .artigo-conteudo {
                flex: 1;
                min-width: 250px;
                text-align: left;
            }

            .artigo-conteudo h2 {
                margin-top: 0;
            }

            .artigo-autor {
                font-weight: bold;
                color: #adff2f;
            }

            /* Estilização dos Botões */
            .botoes-container {
                display: flex;
                gap: 12px;
                margin-top: 15px;
            }

            button {
                background-color: #230436;
                color: #00ffea;
                border: 2px solid #00ffea;
                padding: 8px 16px;
                font-size: 1rem;
                font-weight: bold;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.2s ease-in-out;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            button:hover {
                background-color: #00ffea;
                color: #230436;
                transform: scale(1.05);
            }

            button span {
                background-color: rgba(255, 255, 255, 0.2);
                padding: 2px 6px;
                border-radius: 4px;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Spinosaurus</h1>
            <p>Bem-vindo ao maior covil dos Spinosaurus da web!</p>
        </header>

        <main>
            <!-- Primeiro Artigo -->
            <article>
                <img src="imagem-blog.jpg" alt="Uma ilustração épica e hiper-realista de um Spinosaurus caminhando pelas águas rasas de um rio pré-histórico durante o pôr do sol. O dinossauro possui escamas detalhadas nas cores preto e dourado, garras afiadas e uma impressionante espinha dorsal (vela) destacada pela luz avermelhada do horizonte. Ao fundo, uma floresta tropical densa com samambaias gigantes, vulcões ativos soltando fumaça e pterodáctilos voando sob um céu alaranjado e dramático. No canto inferior direito, o logotipo dourado 'Spinosaurus'.">
                <div class="artigo-conteudo">
                    <h2>O Verdadeiro Rei da Pré-História</h2>    
                    <p>O maior de todos os carnívoros.</p>
                    <p class="artigo-autor">Por: Rafael</p>
                    <div class="botoes-container">
                        <button>🦖 <span>0</span></button>
                        <button>🦕 <span>0</span></button>
                    </div>
                </div>
            </article>

            <!-- Segundo Artigo -->
            <article>
                <img src="imagemblog2.jpeg" alt="Uma impressionante imagem de fundo para site, ambientada numa paisagem pré-histórica vibrante com vegetação tropical, vulcões e um rio. No centro, destaca-se um imponente Tyrannosaurus Rex, rodeado por outros dinossauros como Triceratops.">
                <div class="artigo-conteudo">
                    <h2>O Maior Predador Da Pré-História</h2>    
                    <p>Dominando os antigos ecossistemas.</p>
                    <p class="artigo-autor">Por: Rafael</p>
                    <div class="botoes-container">
                        <button>🦖 <span>0</span></button>
                        <button>🦕 <span>0</span></button>
                    </div>
                </div>
            </article>
        </main>

        <script>
            const botoes = document.querySelectorAll("main button");
            
            botoes.forEach(function(botao) {
                botao.addEventListener("click", function() {
                    console.log("Fui clicado!");
                    let contadorSpan = botao.querySelector("span");
                    contadorSpan.textContent = Number(contadorSpan.textContent) + 1;
                });
            });
        </script>
    </body>
</html>
